name: NuGet Trusted Publishing check

# A dry run of exactly the failure mode that broke v6.4.2's first publish attempt: NuGet/login
# reporting "success" while the OIDC-exchanged API key it hands back is silently unusable (wrong
# output name, revoked Trusted Publishing policy, expired token exchange, etc.). ci.yml's real
# publish job only runs on a version-tag push, which means a break here would otherwise go
# undetected until the next actual release -- exactly what happened to v6.4.2.
#
# This workflow exercises the same login step in isolation, on a schedule, WITHOUT packing or
# pushing anything to NuGet -- there is nothing here that can accidentally publish a package.
#
# Runs monthly, unattended, and on demand from the Actions tab (e.g. after touching ci.yml's
# publish job or the NuGet Trusted Publishing policy at nuget.org/account/trustedpublishing).
on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # only used by the failure-reporting step below
  id-token: write # lets this job request an OIDC token to exchange via NuGet/login

jobs:
  check:
    name: Verify Trusted Publishing login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: junaidaslam

      - name: Verify the returned API key is actually usable
        id: verify
        run: |
          KEY="${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          # Mask immediately -- this is a real short-lived NuGet API key, even though the
          # workflow log never echoes it directly.
          echo "::add-mask::$KEY"
          if [ -z "$KEY" ]; then
            echo "::error::NuGet/login reported success but NUGET_API_KEY came back empty. This is exactly the v6.4.2 failure mode: check the action's current action.yml for its real output name, and that ci.yml's publish job reads the same one."
            exit 1
          fi
          if [ "${#KEY}" -lt 20 ]; then
            echo "::error::NUGET_API_KEY came back suspiciously short (${#KEY} chars). Treating as a failed exchange."
            exit 1
          fi
          echo "Got a non-empty, plausibly-shaped API key (${#KEY} chars) from Trusted Publishing."

      # Only reached if the steps above failed. Mirrors integration.yml's failure-reporting job:
      # reuse an already-open issue rather than filing a duplicate every month the same thing is
      # still broken.
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const [name, color, description] of [
              ['nuget-publish-check-failure', 'b60205', 'Scheduled NuGet Trusted Publishing check failed'],
              ['bug', 'd73a4a', 'Something is not working'],
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'nuget-publish-check-failure',
            });
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled NuGet Trusted Publishing check failed: ${runUrl}`,
              '',
              'This means the NEXT real version-tag push would fail to publish to NuGet, the same',
              'way v6.4.2 did on its first attempt. Likely causes: the Trusted Publishing policy at',
              'nuget.org/account/trustedpublishing was revoked or no longer matches this repo/workflow',
              'file, or NuGet/login changed its output contract again.',
              '',
              'Fix it BEFORE the next release tag is pushed, not after.',
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing[0].number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'NuGet Trusted Publishing check failed',
                body,
                labels: ['nuget-publish-check-failure', 'bug'],
              });
            }
