name: CI

# Build & test on every push to master and every PR. Publishing happens only when a
# version tag (e.g. v5.2.0) is pushed — see the publish job's `if` condition.
#
# schedule/workflow_dispatch also reach the publish job, but only ever in DRY-RUN mode (see
# IS_DRY_RUN below) — they verify NuGet Trusted Publishing's login step still returns a usable key,
# without packing or pushing anything. This has to live in ci.yml itself, not a separate workflow
# file: NuGet's Trusted Publishing policy for this repo is scoped to the exact workflow filename
# (see the v6.4.2 release notes — a standalone nuget-trust-check.yml was tried first and every run
# 401's with "Workflow mismatch", regardless of whether the real publish path is healthy).
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  schedule:
    # 06:00 UTC on the 1st of every month — dry-run only, see IS_DRY_RUN.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Source Link can stamp the exact commit

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  publish:
    name: Publish to NuGet
    needs: build-test
    runs-on: ubuntu-latest
    # Real publish: a pushed version tag. Dry run (see IS_DRY_RUN): manual dispatch, or the monthly
    # schedule. Never for a plain branch push or a PR.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # id-token: write lets this job request an OIDC token to exchange for a short-lived NuGet
    # API key via Trusted Publishing (see nuget-login step below) instead of a stored secret.
    permissions:
      contents: read
      id-token: write
      issues: write # only used by the dry-run failure-reporting step below
    env:
      # The ONLY real publish path is an actual tag push. schedule/workflow_dispatch verify the
      # login step without packing or pushing anything real.
      IS_DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Build everything first (all TFMs, incl. core's netstandard2.0), then pack with --no-build.
      # Packing without a prior build trips NU5026 here because GeneratePackageOnBuild=true changes
      # the pack/build target ordering on a clean checkout.
      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: |
          dotnet pack Junaid.GoogleGemini.Net/Junaid.GoogleGemini.Net.csproj -c Release --no-build -o ${{ github.workspace }}/artifacts
          dotnet pack Junaid.GoogleGemini.Net.Extensions.AI/Junaid.GoogleGemini.Net.Extensions.AI.csproj -c Release --no-build -o ${{ github.workspace }}/artifacts

      - name: Log in to NuGet.org
        # Exchanges this job's OIDC token for a short-lived NuGet API key via the Trusted
        # Publishing policy configured at nuget.org/account/trustedpublishing for this repo +
        # workflow file. No stored secret, nothing to rotate or expire.
        # Pinned to an exact tag (not the floating v1) because this step's own output name is
        # exactly the kind of thing that breaks silently across an unpinned upgrade -- see the
        # v6.4.2 release notes for the real instance of that happening.
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: junaidaslam

      - name: Push to NuGet
        # NuGet/login's actual output key is NUGET_API_KEY, not "api-key" (verified against the
        # action's own action.yml after v6.4.2's tag push failed with an empty key / 401 -- this
        # line was never exercised live before then; v6.4.1 and earlier still used a stored secret,
        # and Trusted Publishing landed after that tag was pushed).
        if: env.IS_DRY_RUN == 'false'
        run: dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Verify the returned API key is actually usable (dry run only)
        # Exercises the same failure mode that broke v6.4.2's first publish attempt -- NuGet/login
        # reporting "success" while the key it hands back is silently unusable -- without pushing
        # anything. Runs monthly and on demand so a break here is caught within weeks, not at the
        # next real release.
        if: env.IS_DRY_RUN == 'true'
        run: |
          KEY="${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          echo "::add-mask::$KEY"
          if [ -z "$KEY" ]; then
            echo "::error::NuGet/login reported success but NUGET_API_KEY came back empty. This is exactly the v6.4.2 failure mode: check the action's current action.yml for its real output name, and that this file reads the same one."
            exit 1
          fi
          if [ "${#KEY}" -lt 20 ]; then
            echo "::error::NUGET_API_KEY came back suspiciously short (${#KEY} chars). Treating as a failed exchange."
            exit 1
          fi
          echo "Got a non-empty, plausibly-shaped API key (${#KEY} chars) from Trusted Publishing."

      # Only reached if a DRY RUN failed above. A real tag-push failure needs no separate issue --
      # it already fails the release visibly. Mirrors integration.yml's failure-reporting job: reuse
      # an already-open issue rather than filing a duplicate every month the same thing is broken.
      - name: File an issue on dry-run failure
        if: failure() && env.IS_DRY_RUN == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const [name, color, description] of [
              ['nuget-publish-check-failure', 'b60205', 'Scheduled NuGet Trusted Publishing check failed'],
              ['bug', 'd73a4a', 'Something is not working'],
            ]) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'nuget-publish-check-failure',
            });
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled NuGet Trusted Publishing dry run failed: ${runUrl}`,
              '',
              'This means the NEXT real version-tag push would likely fail to publish to NuGet, the',
              'same way v6.4.2 did on its first attempt. Likely causes: the Trusted Publishing policy',
              'at nuget.org/account/trustedpublishing was revoked or no longer matches this repo/',
              'workflow file, or NuGet/login changed its output contract again.',
              '',
              'Fix it BEFORE the next release tag is pushed, not after.',
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing[0].number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'NuGet Trusted Publishing check failed',
                body,
                labels: ['nuget-publish-check-failure', 'bug'],
              });
            }
