name: CI

# Build & test on every push to master and every PR. Publishing happens only when a
# version tag (e.g. v5.2.0) is pushed — see the publish job's `if` condition.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so Source Link can stamp the exact commit

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  publish:
    name: Publish to NuGet
    needs: build-test
    runs-on: ubuntu-latest
    # Only run for pushed version tags, never for branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write lets this job request an OIDC token to exchange for a short-lived NuGet
    # API key via Trusted Publishing (see nuget-login step below) instead of a stored secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Build everything first (all TFMs, incl. core's netstandard2.0), then pack with --no-build.
      # Packing without a prior build trips NU5026 here because GeneratePackageOnBuild=true changes
      # the pack/build target ordering on a clean checkout.
      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: |
          dotnet pack Junaid.GoogleGemini.Net/Junaid.GoogleGemini.Net.csproj -c Release --no-build -o ${{ github.workspace }}/artifacts
          dotnet pack Junaid.GoogleGemini.Net.Extensions.AI/Junaid.GoogleGemini.Net.Extensions.AI.csproj -c Release --no-build -o ${{ github.workspace }}/artifacts

      - name: Log in to NuGet.org
        # Exchanges this job's OIDC token for a short-lived NuGet API key via the Trusted
        # Publishing policy configured at nuget.org/account/trustedpublishing for this repo +
        # workflow file. No stored secret, nothing to rotate or expire.
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: junaidaslam

      - name: Push to NuGet
        run: dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.api-key }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
